name: One-shot KDA blog update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-kda-blog.yml'

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Patch the KDA article
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('content/blogs/kimi-kda-cache-sglang-vllm-mooncake-store.mdx')
          text = path.read_text(encoding='utf-8')

          def replace_once(src: str, old: str, new: str, label: str) -> str:
              count = src.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return src.replace(old, new, 1)

          def insert_after(src: str, marker: str, addition: str, label: str) -> str:
              count = src.count(marker)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one marker, found {count}')
              idx = src.index(marker) + len(marker)
              return src[:idx] + addition + src[idx:]

          text = replace_once(
              text,
              "description: '从 Kimi KDA 状态出发，端到端追踪 SGLang UnifiedRadixCache / HiCache 与 vLLM Hybrid KV Cache 如何接入 Mooncake Store，并分析共享前缀分叉 checkpoint 的创建、持久化和复用边界。'",
              "description: '从 Kimi Linear 的 KDA 状态出发，端到端追踪 SGLang、vLLM 与 Mooncake Store 的 hybrid cache 链路，并结合 Kimi K3 更新解释 fine-grained checkpoint、Copy-on-Write、远端 partial-group hit 与复用边界。'",
              'frontmatter description',
          )
          text = replace_once(
              text,
              "  - kimi-linear\n  - kda",
              "  - kimi-linear\n  - kimi-k3\n  - kda",
              'kimi-k3 topic',
          )

          text = replace_once(
              text,
              "两条链都已具备 KDA 状态的数据传输能力，但远端共享前缀复用尚未完全打通：SGLang 缺少 HiCache 模式下的分叉状态补算，vLLM 则没有把分叉边界完整传入 `MooncakeStoreConnector`。后文会分别定位这两个控制面缺口。",
              "两条链都已具备完整 KDA checkpoint 的存储与传输数据面；当 MLA/KV 与 KDA checkpoint 在同一 prefix 边界同时存在时，两边都能表达这个完整命中。真正仍未完全打通的是“只有部分 cache group 命中时，谁负责发现缺失边界并补出 KDA state”：SGLang HiCache 暂时跳过 branching-state fill；vLLM 已补上部分本地 connector divergence 的回退协调，但 Mooncake Store 远端 lookup 仍不会返回 MLA-only 更长命中所对应的 missing KDA boundary。后文会把“完整 checkpoint 复用”和“缺失 checkpoint 自动补算”分开讨论。",
              'opening status summary',
          )

          update_marker = "KDA 的数学部分以 Moonshot AI 的 [`Kimi Linear` 技术报告](https://arxiv.org/pdf/2510.26692)第 2、3、4 节和附录 B、C 为准，并用官方开源的 [`fla/ops/kda`](https://github.com/fla-org/flash-linear-attention/tree/main/fla/ops/kda)以及下文固定版本的 SGLang、vLLM 实现交叉核对。论文使用 `S ∈ R^(d_k × d_v)`；不同 kernel 可能为了访存把最后两维转置，本文讲公式时沿用论文方向。"
          update_section = r'''

## 2026-07-24 更新：Kimi K3 与 vLLM 细粒度 checkpoint

本文正文仍以 2026 年 7 月 21—22 日的固定源码快照为基线。此后 vLLM 合入了 hybrid model 的 fine-grained partial prefix-cache 支持，并在 7 月 22 日发布了 [Kimi K3 serving 预览](https://vllm.ai/blog/2026-07-22-kimi-k3-preview)。增量实现主要落在 [PR #46384](https://github.com/vllm-project/vllm/pull/46384)。这批变化没有推翻本文的核心模型，而是把三个原本容易混在一起的概念彻底拆开：

```text
physical state block size
  管理状态页的物理分配与 block table

prefix_match_unit
  决定 rolling hash 和 lookup 的最细 token 边界

actual checkpoint set
  只有 scheduler 真正停下、算子输出完整状态并注册 hash 的边界
```

因此，`physical KDA block = 4096`、`prefix_match_unit = 64` 时，vLLM 可以在物理 block `[4096, 8192)` 内注册：

```text
H6976 -> C(P6976)
```

这里的 `C(P6976)` 仍是一份完整的 `(ShortConv window, recurrent state)`。**一个物理 state slot 只承载一个精确边界的 checkpoint**，并不是在同一页里同时保存 `S4160、S4224、...、S6976`。在默认保留物理边界、且没有发生淘汰的简化例子里，一个 6976-token 请求可能留下 `C(P4096)` 与额外的 partial-tail `C(P6976)`；它不会因为 match unit 是 64 就自动生成 109 份状态。

当另一条请求命中 `P6976` 并继续 64 token 时，流程是：

```text
cached C(P6976) --Copy-on-Write--> request-private working state
                                      |
                                      +-- forward 64 tokens --> C(P7040)
```

缓存中的 `C(P6976)` 不会被更新成 `C(P7040)`。如果产生它的原请求自己继续，vLLM 会把 `H6976 -> C(P6976)` 迁移到 cache-owned copy，让原 working block 留在请求侧继续写；这就是 owner-continue 的反向 CoW。之后若 7040 也被实际注册，cache 中可以同时存在两个不可变映射。

理论最坏情况下，许多不同长度的请求确实可能沿同一条 prefix 链逐渐贡献：

```text
H64 -> C(P64)
H128 -> C(P128)
...
H8192 -> C(P8192)
```

但这是多个请求产生的唯一 `(prefix hash, token length)` checkpoint 集合，不是单个 8192-token 请求自动保存 128 份状态。相同 prefix 会去重，实际驻留数量还受 creation policy、retention、state-pool 容量和 LRU eviction 限制。

这次更新同时修正一个控制面细节：最新 vLLM scheduler 已在“本地 cache group 命中分歧、connector 又没有返回 external tokens”时回退到普通 hybrid fixed point，恢复所有 group 一致的边界与 `shared_prefix_boundary`。但是，Mooncake Store 的远端 lookup 目前仍主要返回最终协调后的 hit length 与 per-group load mask；当 Store 只有更长 MLA/KV、却没有同边界 KDA checkpoint 时，它仍不会把那个 **remote missing KDA boundary** 单独报告给 scheduler。所以下文关于远端 partial-group 自动补点的结论仍成立，但范围应缩窄到这个场景。

K3 预览还明确说明，非分离式 serving 主路径已经工作，而 Dynamo + vLLM + Mooncake 的分离部署、offload 与大规模验证仍在推进。因此，官方预览可以作为 cache-core 设计的确认，不能单独替代 KDA + Mooncake 的完整生产级端到端测试。
'''
          text = insert_after(text, update_marker, update_section, 'K3 update section')

          remote_start = "## Mooncake Store 尚未打通缺失分叉 checkpoint 的自动补算"
          diagram_marker = '<SequenceDiagram\n  title="当前 Mooncake Store 链条在哪一段断开"'
          start_idx = text.index(remote_start)
          end_idx = text.index(diagram_marker, start_idx)
          new_remote_section = r'''## Mooncake Store 仍缺少远端 partial-group missing boundary

需要继续确认的是：当 `C(P_1k)` 不存在、但某个 Attention cache group 已经命中到 `P_1k` 时，系统能否发现这个缺口并自动补算。

本文原始快照里，挂上 connector 后的特殊 scheduler 分支会直接采用 Full Attention group 的较长本地命中，并丢失 `shared_prefix_boundary`。最新 vLLM 已经缩小了这个问题：[`get_computed_blocks_for_connector`](https://github.com/vllm-project/vllm/blob/main/vllm/v1/core/kv_cache_manager.py) 现在同时返回本地 blocks、local hit、`shared_prefix_boundary` 与 `hit_diverged`；若本地 group 命中发生分歧，而 connector 最终没有返回 external tokens，scheduler 会回退到普通 [`get_computed_blocks`](https://github.com/vllm-project/vllm/blob/main/vllm/v1/core/sched/scheduler.py) 路径，重新求所有 cache group 一致的 fixed point。

也就是说，下面这个**纯本地 divergence + connector miss** 场景已经能恢复正确边界：

```text
local MLA hit = 1k
local KDA hit = 0
external hit  = 0

-> fallback to hybrid fixed point
-> final local hit = 0
-> shared_prefix_boundary = 1k
-> scheduler 可以停在 1k 补 C(P_1k)
```

剩余缺口发生在远端 metadata 本身。当前 [`MooncakeStoreCoordinator`](https://github.com/vllm-project/vllm/blob/main/vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/coordinator.py) 对外主要返回：

```text
final reconciled hit length
per-group load mask
```

它不会同时返回：

```text
remote MLA-only longest hit
best remote KDA checkpoint
missing KDA boundary
```

因此，如果本地没有 1k 的额外线索，而 Mooncake Store 中只有 `MLA(P_1k)`、没有 `C(P_1k)`，external coordinator 会把最终 hybrid hit 协调回 0，却不会告诉 scheduler“远端 MLA 已经到 1k，请恰好算到 1k 并生成 KDA checkpoint”。

Store retention 也仍主要把 prompt replay boundary 作为显式 reachable boundary。要真正闭合远端补点链路，需要把 external per-group divergence 或 `missing_branching_boundary` 一路传给 scheduler、partial-tail registration 和 Store save mask。

所以最新判断应写成：

```text
完整 remote checkpoint 已存在
  -> MLA/KV + KDA raw state 可以协调、加载和复用

只有 remote MLA/KV，缺少同边界 KDA state
  -> final hybrid hit 会缩短
  -> 当前 remote lookup 不暴露 missing KDA boundary
  -> 不会仅凭这次远端命中自动合成 C(P_1k)
```
'''
          text = text[:start_idx] + new_remote_section + '\n\n' + text[end_idx:]

          text = replace_once(
              text,
              "detail: 'connector 分支取 max hit，并清零 shared_prefix_boundary',",
              "detail: '本地 divergence + connector miss 已回退 fixed point；远端 lookup 仍只返回 final hit',",
              'sequence diagram connector detail',
          )

          text = replace_once(
              text,
              "远端缺失分叉点         HiCache 下暂不自动 fill         connector 分支丢 boundary",
              "远端缺失分叉点         HiCache 下暂不自动 fill         remote lookup 不返回 missing boundary",
              'comparison table remote boundary',
          )
          text = replace_once(
              text,
              "缺失分叉 checkpoint 自动补  已实现        boundary 未传播",
              "缺失分叉 checkpoint 自动补  已实现        本地 fallback 已补；远端 missing boundary 未返回",
              'capability table remote boundary',
          )

          case_anchor = text.index("## 同一个 req1 / req2 / req3 案例怎样穿过两条链")
          case_start = text.index("### vLLM + MooncakeStoreConnector", case_anchor)
          case_end = text.index("## 补齐两条远端复用链分别需要什么", case_start)
          new_case = r'''### vLLM + MooncakeStoreConnector

```text
Store 已有 MLA(P_1k) + KDA raw pages @ P_1k
  -> coordinator 可以得到完整 1k hit
  -> 两个 cache group 装回各自 GPU blocks

Store 只有 MLA(P_1k)，没有 KDA state
  -> external coordinator 返回协调后的 final hit（通常回到 0）
  -> 不返回“remote MLA-only hit = 1k”对应的 missing boundary
  -> 本地 connector-miss fallback 只能处理本地已知 divergence
  -> req2 仍不会仅凭远端 metadata 自动停在 1k 补 C(P_1k)
```

'''
          text = text[:case_start] + new_case + text[case_end:]

          needs_anchor = text.index("## 补齐两条远端复用链分别需要什么")
          needs_start = text.index("### vLLM + MooncakeStoreConnector", needs_anchor)
          needs_end = text.index("两边都应补同一个测试矩阵：", needs_start)
          new_needs = r'''### vLLM + MooncakeStoreConnector

最新 main 已补上“本地 group divergence + external miss”时的 fixed-point fallback。剩余的最小改动集中在远端 partial-group metadata：

```text
1. external lookup 保留 per-group hit，或直接返回 missing_branching_boundary
2. scheduler 对 local + external 结果统一做 hybrid fixed point
3. remote longer-group hit > final hit 时设置 shared_prefix_boundary
4. _mamba_block_aligned_split 在 missing boundary 结束 forward
5. Store ReqMeta / save mask pin 住新 KDA state
6. KDA group 按精确 token length 注册 immutable raw page
7. partial entry 继续执行时走 Copy-on-Write，旧 checkpoint 保持不变
```

'''
          text = text[:needs_start] + new_needs + text[needs_end:]

          text = replace_once(
              text,
              "## 六个常见误区",
              "## 七个常见误区",
              'misconception heading',
          )

          misconception_marker = "## 最终判断"
          misconception = r'''### 7. 认为一个大 physical state block 内保存了所有细粒度状态

`physical block = 4096`、`prefix_match_unit = 64` 只表示一个大状态页可以用 64-token 粒度的 hash 标识某个有效尾部，例如 `H6976 -> C(P6976)`。这个 state slot 只保存 `C(P6976)`，不会同时装下 block 内的所有 `S_t`。

不同请求若分别在 64、128、192 等边界结束，理论上可以逐渐产生多个独立 checkpoint，最坏甚至铺满到 8192；但每一份都对应独立、不可变的 `(prefix hash, token length)` 和物理 state slot。请求从旧 checkpoint 继续时先做 CoW，旧状态不会原地变成更长状态。实际驻留数量由去重、creation policy、retention、state-pool 容量与 LRU 共同限制。

'''
          text = insert_after(text, misconception_marker, '', 'final heading presence')
          final_idx = text.index(misconception_marker)
          text = text[:final_idx] + misconception + text[final_idx:]

          text = replace_once(
              text,
              "> SGLang + HiCache 已把 KDA 的 temporal/conv checkpoint 接到 Mooncake 的完整读写数据面，但 HiCache 模式暂时跳过 branching-state fill；vLLM 本地已有共享前缀分叉点截断机制，但该信号尚未完整穿过 `MooncakeStoreConnector`。两条链都能复用一个已经存在且完整的 `C(P_t)`；但在本文固定版本中，当远端只有 MLA 命中而缺少 KDA checkpoint 时，系统仍不会自动补算该状态。",
              "> SGLang + HiCache 已把 KDA 的 temporal/conv checkpoint 接到 Mooncake 的完整读写数据面，但 HiCache 模式仍暂时跳过 branching-state fill。vLLM 最新 main 已补上本地 cache-group divergence 且 connector miss 时的 fixed-point fallback，也正式支持 physical block 内的 fine-grained partial checkpoint 与 Copy-on-Write；但 `MooncakeStoreCoordinator` 远端 lookup 仍不单独返回 MLA-only 更长命中所对应的 missing KDA boundary。两条链都能复用一个已经存在且完整的 `C(P_t)`，但远端只有 MLA 命中、缺少 KDA checkpoint 时，仍不会仅凭这次 lookup 自动补算该状态。",
              'final remote-cache conclusion',
          )

          final_tail = "优化目标不是机械地每隔 1k 切一次 forward，而是在出现可复用分叉时仅补算一次，并把该边界持续传递到本地 radix/scheduler、Host staging、Mooncake key/value、lookup 与 retention policy 各层。"
          final_tail_new = final_tail + " 对 vLLM 而言，还要始终区分 physical state block、prefix match unit 与实际 checkpoint 集合：细粒度可寻址不等于细粒度状态自动生成；一旦 checkpoint 发布，它应保持不可变，后续扩展通过 CoW 产生新的 working state 或新 checkpoint。"
          text = replace_once(text, final_tail, final_tail_new, 'final design takeaway')

          path.write_text(text, encoding='utf-8')
          print(f'updated {path}: {len(text.splitlines())} lines')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run content tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check internal links and metadata
        run: npm run check:links

      - name: Commit the updated article
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/blogs/kimi-kda-cache-sglang-vllm-mooncake-store.mdx
          git diff --cached --check
          git commit -m 'Update KDA cache blog for Kimi K3'
          git push origin HEAD:main
