name: Update blog date once

on:
  push:
    paths:
      - '.github/workflows/update-blog-date-once.yml'

permissions:
  contents: write

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update publication date
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('content/blogs/attention-cache-size-mha-mla-dsa-swa-kda.mdx')
          text = path.read_text(encoding='utf-8')

          old_date = "date: '2026-04-30'"
          new_date = "date: '2026-06-22'"
          old_note = '> 本文按站点归档日期发布于 2026-04-30；DeepSeek V4 与 GLM-5.2 的公开模型配置、论文和计算示例更新于 2026-07-24。'
          new_note = '> 本文按站点归档日期发布于 2026-06-22；DeepSeek V4 与 GLM-5.2 的公开模型配置、论文和计算示例更新于 2026-07-24。'

          if text.count(old_date) != 1:
              raise SystemExit(f'expected exactly one old frontmatter date, found {text.count(old_date)}')
          if text.count(old_note) != 1:
              raise SystemExit(f'expected exactly one old archive note, found {text.count(old_note)}')

          text = text.replace(old_date, new_date, 1).replace(old_note, new_note, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-off workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/update-blog-date-once.yml
          git add content/blogs/attention-cache-size-mha-mla-dsa-swa-kda.mdx
          git commit -m 'Update attention cache blog date'
          git push origin HEAD:main
