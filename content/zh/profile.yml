aboutParagraphs:
  - 我现在主要负责大模型推理引擎的性能优化，关注请求调度、KV Cache 管理、跨节点数据传输和异构加速后端。
  - 此前，我在华为做过分布式存储的高可用与集群管理，也做过云工作负载分析和 CPU 体系结构优化。
  - 这个网站用来整理我参与的工程项目、阅读源码时形成的笔记，以及实际调试和验证过程中积累的方法。

currentFocus:
  eyebrow: 当前重点
  title: 大模型推理系统
  summary: >
    我的工作主要集中在推理调度、KV Cache 管理、跨节点数据传输和
    异构后端性能优化。
  bullets:
    - 分析请求调度和执行链路中的吞吐、延迟与内存瓶颈。
    - 追踪 KV Cache 在预填充、解码、回载和传输过程中的状态变化。
    - 验证 Mooncake Transfer Engine 与推理后端的集成流程。
    - 参与 SGLang 请求处理、调度和缓存相关功能的开发与分析。
  links:
    - label: 项目
      href: /projects/
    - label: 源码笔记
      href: /blogs/

selectedWork:
  - eyebrow: 推理系统原型
    title: SGLang Rust Runtime
    description: 用 Rust 实现并验证请求生命周期、调度、前缀缓存、协议处理和 PD 传输流程。目前用于架构与集成实验，不是生产级 SGLang 的替代品。
    link:
      label: 查看项目范围
      href: https://github.com/imReese/sglang-rs#current-scope
  - eyebrow: KV Cache 平台
    title: NexusKV
    description: 将 KV Cache 的复用规划、状态索引、数据搬运和推理引擎适配拆分为独立模块。目前已完成基础框架与测试，远程传输仍在开发中。
    link:
      label: 查看设计文档
      href: https://github.com/imReese/NexusKV/blob/main/docs/design/execution-boundary.md
  - eyebrow: 源码分析
    title: Mooncake 与 HiCache 源码
    description: 沿 SGLang、HiCache 和 Mooncake Store 的真实读写路径，梳理缓存查找、主机内存回载、元数据同步和跨节点传输的职责分工。
    link:
      label: 阅读源码分析
      href: /blogs/sglang-to-mooncake-store-kv-cache-path/

researchAreas:
  - title: 推理引擎
    label: 调度与执行
    description: 分析请求调度、算子、内核和后端调用中的性能瓶颈。
    points:
      - 吞吐与延迟
      - 算子与内核路径
      - 预填充与解码行为
    tags:
      - 大模型推理
      - 推理引擎
      - 调度
  - title: KV Cache
    label: 缓存管理
    description: 关注前缀复用、KV 页生命周期、内存驻留和跨层回载。
    points:
      - 前缀缓存行为
      - KV 页生命周期
      - 缓存命中与驻留状态
    tags:
      - 缓存
      - KV Cache
      - 内存
  - title: Mooncake Transfer Engine
    label: 数据传输
    description: 分析 KV 数据的传输规划、内存注册、描述符和就绪状态。
    points:
      - KV 传输规划
      - 描述符与校验和
      - KV 就绪判断
    tags:
      - Mooncake
      - Transfer Engine
      - PD 分离式推理
  - title: 异构加速
    label: 后端优化
    description: 适配并优化不同加速器上的推理路径，同时尽量隔离设备相关逻辑。
    points:
      - 加速器后端路径
      - 设备相关执行逻辑
      - 后端抽象
    tags:
      - 异构加速
      - 推理引擎
      - 后端优化

