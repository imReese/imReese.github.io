focusAreas:
  - AI 推理
  - KV Cache

aboutParagraphs:
  - 我从事大模型推理系统研发与性能优化，工作覆盖运行时调度与执行、分布式推理服务，以及注意力状态的存储与复用。
  - 我参与团队自有 Attention Store 的研发与适配，覆盖 Kimi、DeepSeek、GLM 模型系列，支持 KDA 和流水线并行部署，并优化 H2D、D2H 缓存传输与 GPU 计算的重叠。
  - 此前，我在华为做过分布式存储的高可用与集群管理，也做过云工作负载分析和 CPU 体系结构优化。
  - 这个网站用来整理我参与的工程项目、阅读源码时形成的笔记，以及实际调试和验证过程中积累的方法。

currentFocus:
  eyebrow: 当前重点
  title: 大模型推理系统
  summary: >
    围绕推理调度、注意力状态存储与 GPU 执行之间的协同，
    优化推理服务的吞吐、延迟与资源利用率。
  bullets:
    - 运行时调度与执行优化，包括 Prefill 加速、EPD 推理与约束解码。
    - Attention Store 适配 Kimi、DeepSeek、GLM 模型系列，支持 KDA。
    - 支持流水线并行（PP）部署下的 L3 存储。
    - 实现 H2D、D2H 缓存传输与 GPU 批次执行的重叠。
  links:
    - label: 项目
      href: /projects/
    - label: 源码笔记
      href: /blogs/

selectedWork:
  - eyebrow: 推理系统原型
    title: SGLang Rust Runtime
    description: 用 Rust 实现并验证请求生命周期、调度、前缀缓存、协议处理和 PD 传输流程。目前用于架构与集成实验，不是生产级 SGLang 的替代品。
    link:
      label: 查看项目范围
      href: https://github.com/imReese/sglang-rs#current-scope
  - eyebrow: KV Cache 平台
    title: NexusKV
    description: 将 KV Cache 的复用规划、状态索引、数据搬运和推理引擎适配拆分为独立模块。目前已完成基础框架与测试，远程传输仍在开发中。
    link:
      label: 查看设计文档
      href: https://github.com/imReese/NexusKV/blob/main/docs/design/execution-boundary.md
  - eyebrow: 推理控制面
    title: Locus
    description: 面向多引擎的推理控制面，结合模型语义、集群策略、运行时能力与可复用状态的位置规划请求部署。本地协议与编排路径已实现，真实部署仍需独立验证。
    link:
      label: 查看架构设计
      href: https://github.com/imReese/Locus/blob/main/docs/design/architecture.md

researchAreas:
  - title: 推理引擎
    label: 调度与执行
    description: 围绕请求生命周期，优化 Prefill 执行、分离式推理与约束解码。
    points:
      - Prefill 加速与 EPD
      - 批次调度与执行
      - 约束解码
    tags:
      - 大模型推理
      - 推理引擎
      - 调度
  - title: Attention Store
    label: 状态存储与复用
    description: 面向多模型与多种并行部署，开发注意力状态的存储与复用能力。
    points:
      - Kimi、DeepSeek 与 GLM
      - KV Cache 与 KDA 状态
      - 流水线并行与 L3 存储
    tags:
      - KV Cache
      - KDA
      - 流水线并行
  - title: 异步执行
    label: 传输与计算重叠
    description: 通过主机与设备间的缓存传输和 GPU 批次执行重叠，降低暴露在关键路径上的缓存 I/O 开销。
    points:
      - H2D 与 D2H 传输
      - 缓存回载与持久化
      - GPU 执行重叠
    tags:
      - GPU
      - 缓存 I/O
      - 性能优化
  - title: 异构加速
    label: 后端优化
    description: 适配并优化不同加速器上的推理路径，同时尽量隔离设备相关逻辑。
    points:
      - 加速器后端路径
      - 设备相关执行逻辑
      - 后端抽象
    tags:
      - 异构加速
      - 推理引擎
      - 后端优化

