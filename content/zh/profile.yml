focusAreas:
  - 后端系统
  - 推理 Runtime
  - KV Cache
  - Mooncake TransferEngine
  - SGLang
  - 异构后端

aboutParagraphs:
  - 我做后端系统，关心可靠性、性能，也关心线上行为能不能被看清楚。如果一个系统出了问题却没人能说清楚为什么，那说明还有活要干。
  - 现在的日常围绕大模型推理服务：Runtime 调度路径、KV Cache 生命周期、Mooncake TransferEngine 传输通道，以及不同加速后端上怎么把性能榨干。
  - "我也在持续读 SGLang 的 Rust Runtime——请求怎么走完它的一生，Scheduler 和 Router 之间的边界在哪，gRPC 和 Tokenization 怎么接起来，以及 PD 架构下 KV 传输该怎么规划。"
  - 更早之前在华为做过分布式存储和 CPU 微架构分析。这些经历让我养成了一个习惯：从用户看到的现象开始，一路往下追到线程调度、内存交互和指令流水线。

currentFocus:
  eyebrow: 当前重点
  title: 大模型推理服务的系统工程
  summary: >
    我在给大模型推理铺"高速公路"——从 Cache 调度、KV 传输路径、Mooncake TransferEngine
    到芯片级 Runtime，把整条链路上的瓶颈逐个击破。
  bullets:
    - 在生产推理负载里找瓶颈：吞吐、延迟、Cache 命中率、内存效率，哪里慢就盯哪里。
    - 跟踪 Prefix Cache 和 KV Cache 的生命周期——它们什么时候该留、什么时候该换、Prefill/Decode 路径上的传输有没有就绪。
    - 验证 Mooncake TransferEngine 的系统边界：KV 传输规划、描述符交互、就绪检测，以及和后端的接入点。
    - "把读 SGLang Runtime 学到的东西带回来——请求生命周期、调度策略、Cache 管理和传输边界，反哺自己的服务系统设计。"
  links:
    - label: sglang-rs
      href: https://github.com/imReese/sglang-rs
    - label: 项目
      href: /projects

researchAreas:
  - title: 推理引擎
    label: runtime path
    description: 顺着请求链路一路往下看——调度、算子、Kernel、后端 Dispatch，找出真正拖慢推理的那段路径。
    points:
      - 吞吐 / 延迟
      - 算子与 kernel 路径
      - prefill / decode 行为
    tags:
      - LLM Serving
      - Runtime
      - Scheduling
  - title: Cache 与 KV Cache
    label: memory behavior
    description: 关注 Prefix Cache 和 KV Cache 在真实服务里的生命周期、复用效率和内存压力，让每一块显存都花在刀刃上。
    points:
      - prefix cache 行为
      - KV page 生命周期
      - cache hit 与 residency
    tags:
      - Cache
      - KV Cache
      - Memory
  - title: Mooncake TE
    label: transfer engine
    description: 搞清楚 Mooncake TransferEngine 怎么接入 KV 传输——哪些状态算 ready，哪些边界需要 Runtime 自己兜住。
    points:
      - KV 传输规划
      - descriptor 与 checksum 路径
      - KV-ready 判断
    tags:
      - Mooncake
      - TransferEngine
      - PD
  - title: 异构后端
    label: accelerators
    description: 在不同加速卡上把执行路径跑顺，同时不让设备细节污染 Serving 层的设计。
    points:
      - 加速器后端路径
      - 设备相关 runtime
      - 后端抽象
    tags:
      - Accelerators
      - Runtime
      - Backend

impactStats:
  - value: cache + KV
    label: 内存路径
    detail: 跟踪 Prefix Cache、KV Cache 的生命周期、驻留特征和服务内存行为。
  - value: Mooncake TE
    label: 传输路径
    detail: 验证 KV 传输规划、描述符边界和就绪检测机制。
  - value: heterogeneous
    label: 后端路径
    detail: 在异构加速器上优化推理执行链路，保持后端抽象干净。
  - value: "128 -> 256"
    label: 集群规模
    detail: 扩展分布式存储集群初始化能力。
  - value: "+40%"
    label: 初始化效率
    detail: 通过异步队列和模块解耦优化集群启动路径。
  - value: "90%+"
    label: 分支覆盖率
    detail: 构建 DTFuzz 接口测试，提前挡住高风险存储缺陷。
  - value: "+30%"
    label: TLB 命中率
    detail: 在 ChampSim 里验证动态 TLB 调度思路。
  - value: "+6%"
    label: IPC
    detail: 在 CPU 仿真中度量指令级架构收益。
  - value: "+8%"
    label: 吞吐
    detail: 参与 Kunpeng CPU 工作负载的 SMT 策略调优。

