focusAreas:
  - 后端系统
  - 推理 Runtime
  - KV Cache
  - Mooncake TransferEngine
  - SGLang
  - 异构后端

aboutParagraphs:
  - 我在百度 AI 计算团队做大模型推理引擎性能优化，主要涉及 runtime 调度、KV Cache、Mooncake TransferEngine 和异构加速后端。
  - "我也在跟进 SGLang 的 Rust runtime，包括请求生命周期、Scheduler/Router 边界、gRPC 接口、tokenization 和 PD KV 传输。"
  - 此前在华为云竖亥实验室和数据存储产品线，做过云 workload 特征分析、CPU 体系结构优化，以及分布式存储的高可用与集群管理。

currentFocus:
  eyebrow: 当前重点
  title: 大模型推理引擎与系统性能
  summary: >
    我在百度 AI 计算团队做大模型推理引擎性能优化，主要涉及 runtime 调度、
    KV Cache、Mooncake TransferEngine 和异构加速后端。
  bullets:
    - 分析推理负载的吞吐、延迟、Cache 命中率、内存使用和 runtime 瓶颈。
    - 跟踪 Prefix Cache 和 KV Cache 在 Prefill/Decode 路径上的生命周期。
    - 验证 Mooncake TransferEngine 的 KV 传输规划、描述符、就绪检测和后端接入。
    - "将 SGLang runtime 的请求生命周期、调度、Cache 管理和传输边界用于服务系统设计。"
  links:
    - label: sglang-rs
      href: https://github.com/imReese/sglang-rs
    - label: 项目
      href: /projects

researchAreas:
  - title: 推理引擎
    label: 请求路径
    description: 分析调度、算子、kernel 和 backend dispatch 组成的推理执行路径。
    points:
      - 吞吐 / 延迟
      - 算子与 kernel 路径
      - prefill / decode 行为
    tags:
      - LLM Serving
      - Runtime
      - Scheduling
  - title: Cache 与 KV Cache
    label: 内存行为
    description: 分析 Prefix Cache 和 KV Cache 的生命周期、复用效率、驻留状态和内存压力。
    points:
      - prefix cache 行为
      - KV page 生命周期
      - cache hit 与 residency
    tags:
      - Cache
      - KV Cache
      - Memory
  - title: Mooncake TE
    label: 传输链路
    description: 验证 Mooncake TransferEngine 的 KV 传输规划、描述符、就绪检测和 runtime 边界。
    points:
      - KV 传输规划
      - descriptor 与 checksum 路径
      - KV-ready 判断
    tags:
      - Mooncake
      - TransferEngine
      - PD
  - title: 异构后端
    label: 异构加速
    description: 优化不同加速器的 backend 路径，并将设备相关逻辑限制在后端接口内。
    points:
      - 加速器后端路径
      - 设备相关 runtime
      - 后端抽象
    tags:
      - Accelerators
      - Runtime
      - Backend

impactStats:
  - value: cache + KV
    label: 内存路径
    detail: 跟踪 Prefix Cache、KV Cache 的生命周期、驻留特征和服务内存行为。
  - value: Mooncake TE
    label: 传输路径
    detail: 验证 KV 传输规划、描述符边界和就绪检测机制。
  - value: heterogeneous
    label: 后端路径
    detail: 在异构加速器上优化推理执行链路，保持后端抽象干净。
  - value: "128 -> 256"
    label: 集群规模
    detail: 扩展分布式存储集群初始化能力。
  - value: "+40%"
    label: 初始化效率
    detail: 通过异步队列和模块解耦优化集群启动路径。
  - value: "90%+"
    label: 分支覆盖率
    detail: 构建 DTFuzz 接口测试，提前挡住高风险存储缺陷。
  - value: "+30%"
    label: TLB 命中率
    detail: 在 ChampSim 里验证动态 TLB 调度思路。
  - value: "+6%"
    label: IPC
    detail: 在 CPU 仿真中度量指令级架构收益。
  - value: "+8%"
