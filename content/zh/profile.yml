focusAreas:
  - 后端系统
  - 推理 Runtime
  - KV Cache
  - Mooncake TransferEngine
  - SGLang
  - 异构后端

aboutParagraphs:
  - 我喜欢模型行为真正落到系统问题上的位置：请求状态、调度、Cache 驻留、传输就绪和 Backend capability 必须互相对得上。
  - 我的技术路径从分布式存储高可用与集群管理出发，经过云 workload 和 CPU 分析，现在聚焦大模型推理 Runtime 性能。
  - 这个网站记录的是这条路径背后的工作过程：明确状态的个人项目、标注清楚的 upstream 源码研究，以及能保留实现脉络的文章。

currentFocus:
  eyebrow: 当前重点
  title: 大模型推理引擎与系统性能
  summary: >
    当前工作集中在三类边界：Runtime 执行、KV 状态生命周期，以及异构推理
    Backend 之间的数据搬运。
  bullets:
    - 分析推理负载的吞吐、延迟、Cache 命中率、内存使用和 runtime 瓶颈。
    - 跟踪 Prefix Cache 和 KV Cache 在 Prefill/Decode 路径上的生命周期。
    - 验证 Mooncake TransferEngine 的 KV 传输规划、描述符、就绪检测和后端接入。
    - '将 SGLang runtime 的请求生命周期、调度、Cache 管理和传输边界用于服务系统设计。'
  links:
    - label: 项目
      href: /projects/
    - label: 源码笔记
      href: /blogs/

selectedWork:
  - eyebrow: Runtime prototype
    title: SGLang Rust Runtime
    description: 用 Rust 显式实现并测试请求生命周期、调度、Prefix 复用、协议处理与分阶段 PD 传输集成边界。
    problem: 在生产执行路径仍在建设时，让隐藏状态、能力缺口和 fallback 行为可检查。
    link:
      label: 当前范围与测试
      href: https://github.com/imReese/sglang-rs#current-scope
  - eyebrow: KV cache platform
    title: NexusKV
    description: 用 Go、Rust、Python 拆开控制策略、状态索引规划、执行层和 SGLang/vLLM lifecycle adapter。
    problem: 在真实 data plane 逐步开发时，避免让 reuse planning 和 transfer policy 滑进 connector 分支。
    link:
      label: 架构与执行边界
      href: https://github.com/imReese/NexusKV/blob/main/docs/design/execution-boundary.md
  - eyebrow: Source analysis
    title: Mooncake / HiCache 源码
    description: 沿着具体读写路径追踪 page key、Host KV memory、Store object、replica state 与 shared Transfer Engine 边界。
    problem: 区分容易混在一起的 Cache 命中、materialization、metadata 可见性与数据传输语义。
    link:
      label: SGLang 到 Mooncake KV 路径
      href: /blogs/sglang-to-mooncake-store-kv-cache-path/

researchAreas:
  - title: 推理引擎
    label: 请求路径
    description: 分析调度、算子、kernel 和 backend dispatch 组成的推理执行路径。
    points:
      - 吞吐 / 延迟
      - 算子与 kernel 路径
      - prefill / decode 行为
    tags:
      - LLM Serving
      - Runtime
      - Scheduling
  - title: Cache 与 KV Cache
    label: 内存行为
    description: 分析 Prefix Cache 和 KV Cache 的生命周期、复用效率、驻留状态和内存压力。
    points:
      - prefix cache 行为
      - KV page 生命周期
      - cache hit 与 residency
    tags:
      - Cache
      - KV Cache
      - Memory
  - title: Mooncake TE
    label: 传输链路
    description: 验证 Mooncake TransferEngine 的 KV 传输规划、描述符、就绪检测和 runtime 边界。
    points:
      - KV 传输规划
      - descriptor 与 checksum 路径
      - KV-ready 判断
    tags:
      - Mooncake
      - TransferEngine
      - PD
  - title: 异构后端
    label: 异构加速
    description: 优化不同加速器的 backend 路径，并将设备相关逻辑限制在后端接口内。
    points:
      - 加速器后端路径
      - 设备相关 runtime
      - 后端抽象
    tags:
      - Accelerators
      - Runtime
      - Backend

