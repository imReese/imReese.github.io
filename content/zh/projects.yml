headline: 项目与源码笔记
intro: 这里收录我正在开发的项目，以及围绕 SGLang、Mooncake 和 HiCache 整理的源码笔记。每个项目都会说明当前进展和未完成的部分。

overview:
  - label: Rust 推理原型
    value: SGLang Rust Runtime
    description: 用 Rust 实现和验证请求处理、调度、缓存、协议与 PD 传输流程。
  - label: KV Cache 平台
    value: NexusKV
    description: 将缓存复用、状态索引、数据搬运和推理引擎适配拆分为独立模块。
  - label: 源码笔记
    value: Mooncake 与 HiCache
    description: 沿真实读写流程理解缓存生命周期、Store 语义和 Transfer Engine 接入方式。

items:
  - name: SGLang Rust Runtime
    description: 这是一个独立的 Rust 实验项目，用来实现和验证 SGLang 中的请求处理、调度、缓存和 PD 传输流程。目前可用于架构与集成实验，但尚不具备完整的模型执行、加速器支持和生产部署能力。
    href: https://github.com/imReese/sglang-rs
    label: github.com/imReese/sglang-rs
    status:
      label: 实验阶段
      description: 请求生命周期和部分集成流程已有实现与测试；生产级模型执行、完整加速器支持和部署能力尚未完成。
    capabilities:
      - 用 Rust 实现请求生命周期、预填充/解码调度、KV 页分配和基于 RadixCache 的前缀复用。
      - 提供 Tonic gRPC 接口、兼容 OpenAI 的 HTTP 接口，以及可在单机 CPU 上运行的 PD 冒烟测试。
      - 支持 CPU 参考执行和 CUDA/cuBLAS 动态检测；缺少可用后端时会明确报错。
      - 实现 PD 传输规划、就绪轮询、描述符校验以及 Mooncake ABI 的内存注册流程。
    evidenceLinks:
      - label: 当前范围与限制
        href: https://github.com/imReese/sglang-rs#current-scope
      - label: 请求生命周期测试
        href: https://github.com/imReese/sglang-rs/blob/main/crates/sglang-srt/tests/request_lifecycle.rs
      - label: PD 传输规划测试
        href: https://github.com/imReese/sglang-rs/blob/main/crates/sglang-srt/tests/pd_transfer_plan.rs
      - label: 本地 PD 冒烟测试
        href: https://github.com/imReese/sglang-rs/blob/main/scripts/run_cpu_pd_smoke.sh
    tags:
      - Rust
      - SGLang
      - 调度器
      - KV Cache
      - Mooncake
  - name: NexusKV
    description: NexusKV 将 KV Cache 的复用规划、状态索引、数据搬运和推理引擎适配拆分为独立模块。当前仓库已经包含可运行的基础实现和测试，远程数据传输仍在开发中。
    href: https://github.com/imReese/NexusKV
    label: github.com/imReese/NexusKV
    status:
      label: 基础功能开发中
      description: 数据结构、复用规划、引擎接入流程和基础后端已有实现；RDMA、GPU Direct、分布式协调和性能优化尚未完成。
    capabilities:
      - 使用版本化的注意力状态定义和 Rust nxradixtree 完成精确匹配与前缀复用规划。
      - 通过 PyO3 将 Rust 规划器接入 SGLang 和 vLLM。
      - 基础执行器、后端注册表、回退处理、数据句柄和内存存储均已有实现。
      - 支持 Go 控制面配置和策略热更新；加载失败时继续使用最近一次有效配置。
    evidenceLinks:
      - label: 目标架构
        href: https://github.com/imReese/NexusKV/blob/main/docs/architecture/target-platform.md
      - label: 迁移状态
        href: https://github.com/imReese/NexusKV/blob/main/docs/architecture/migration-status.md
      - label: 规划桥接层
        href: https://github.com/imReese/NexusKV/blob/main/docs/design/python-rust-planner-bridge.md
      - label: 引擎接入流程
        href: https://github.com/imReese/NexusKV/blob/main/docs/design/connector-lifecycle.md
      - label: 执行模块设计
        href: https://github.com/imReese/NexusKV/blob/main/docs/design/execution-boundary.md
    tags:
      - Go
      - Rust
      - Python
      - KV Cache
      - 大模型推理

diagrams:
  runtime:
    eyebrow: 请求流程
    title: SGLang Rust Runtime — 已实现的请求处理流程
    caption: 这张图只展示当前代码和测试已经覆盖的流程；完整模型执行和生产级传输后端仍未实现。
    steps:
      - label: 协议处理
        meta: HTTP / gRPC / 路由
        detail: 校验文本或已分词请求，并保留建立 PD 传输所需的信息。
        items:
          - 类型安全的协议
          - OpenAI 兼容接口
      - label: 调度器
        meta: 等待 → 预填充 → 解码
        detail: 组成批次、控制每批 token 数量，并在 KV 传输就绪前阻止解码。
        items:
          - 请求生命周期
          - 就绪检查
      - label: 缓存与工作进程
        meta: RadixCache + KV 页
        detail: 匹配可复用前缀、从容量有限的页池分配 KV 页，并派发到本地、预填充或解码工作进程。
        items:
          - 页布局
          - 前缀复用
      - label: PD 传输
        meta: 模拟后端 / 状态快照 / Mooncake ABI
        detail: 构造并轮询传输计划；生产级 Mooncake 传输尚未实现。
        items:
          - 校验和
          - 已注册内存
  platform:
    eyebrow: 模块划分
    title: NexusKV — 已实现模块与后续计划
    caption: 各模块分别负责控制、复用规划、数据搬运和引擎接入，避免把所有逻辑都放进引擎适配层。
    groups:
      - label: 控制面
        detail: 已实现基础配置和策略热更新。
        items:
          - Go 配置
          - 健康检查 / 管理
          - 执行策略
        signals:
          - 保留最近一次有效配置
      - label: 状态与索引
        detail: 已实现可版本化的状态格式与 Rust 复用规划器。
        items:
          - 描述符
          - nxradixtree
          - 精确匹配 / 前缀匹配
      - label: 执行与数据传输
        detail: 已有基础执行器和内存后端；远程传输仍在开发中。
        items:
          - 后端注册表
          - 数据句柄
          - 回退处理
        signals:
          - 远程传输尚未完成
      - label: 引擎适配
        detail: 已接入 SGLang 与 vLLM 的请求生命周期。
        items:
          - 预填充 / 扩展阶段
          - 请求启动
          - 接入复用规划器

