headline: 系统工作
intro: 聚焦少量大模型推理系统项目、实现工作与源码研究，直接说明当前范围，并把 tracked fork 与自建项目分开。

overview:
  - label: Runtime
    value: SGLang Rust Runtime
    description: 持续开发中的 Rust runtime 原型，已覆盖请求生命周期、调度、Cache、协议与 PD 传输边界。
  - label: KV Platform
    value: NexusKV
    description: 面向 LLM 的 KV Cache platform foundation，拆分控制面、状态索引、执行层和引擎适配层。
  - label: Source work
    value: Mooncake / HiCache
    description: 围绕 Cache 生命周期、Store 语义与 Transfer Engine 接入路径整理的源码笔记。

items:
  - name: SGLang Rust Runtime
    description: 一个独立 Rust workspace，用显式边界探索 SGLang runtime 职责如何迁移到 Rust。仓库目前适合验证架构与集成路径，不应被理解为已经生产可用的 upstream SGLang 替代品。
    href: https://github.com/imReese/sglang-rs
    label: github.com/imReese/sglang-rs
    status:
      label: 活跃原型
      description: 请求生命周期和多条集成路径已经分阶段实现并测试；生产级 Transformer 执行、完整加速器覆盖和生产部署方案仍未完成。
    capabilities:
      - Rust 请求生命周期、Prefill/Decode 调度、有限 KV page 分配与 RadixCache 风格的 Prefix 复用。
      - Tonic gRPC、OpenAI 兼容 HTTP/Router 边界，以及进程级 CPU PD smoke path。
      - CPU reference execution、动态 CUDA/cuBLAS capability boundary，并对不可用 backend 显式失败。
      - PD transfer planning、就绪轮询、descriptor checksum 与 Mooncake ABI/内存注册生命周期边界。
    evidenceLinks:
      - label: 当前范围与限制
        href: https://github.com/imReese/sglang-rs#current-scope
      - label: 请求生命周期测试
        href: https://github.com/imReese/sglang-rs/blob/main/crates/sglang-srt/tests/request_lifecycle.rs
      - label: PD transfer plan 测试
        href: https://github.com/imReese/sglang-rs/blob/main/crates/sglang-srt/tests/pd_transfer_plan.rs
      - label: 本地 PD smoke
        href: https://github.com/imReese/sglang-rs/blob/main/scripts/run_cpu_pd_smoke.sh
    tags:
      - Rust
      - SGLang
      - Scheduler
      - KV Cache
      - Mooncake
  - name: NexusKV
    description: 一个分阶段建设的 LLM KV cache platform，明确拆分策略与控制、复用规划与状态索引、执行与数据搬运、引擎生命周期适配。当前仓库已包含确定性的实现和测试，传输路径仍在继续建设。
    href: https://github.com/imReese/NexusKV
    label: github.com/imReese/NexusKV
    status:
      label: 平台基础阶段
      description: Contract、planner、connector lifecycle、execution policy 和 baseline backend 已存在；真实远程传输、RDMA/GPU-direct、分布式协调和吞吐优化仍在规划中。
    capabilities:
      - Versioned attention-state contract 与 Rust nxradixtree，实现 exact/prefix reuse planning。
      - 由 SGLang、vLLM connector lifecycle 共用的窄 PyO3 planner bridge。
      - 确定性的 execution runner、backend catalog、fallback model、payload handle 和内存 baseline store。
      - Go control-plane 配置与可重载的 policy handoff，并保留 last-known-good 行为。
    evidenceLinks:
      - label: North star
        href: https://github.com/imReese/NexusKV/blob/main/docs/architecture/target-platform.md
      - label: 迁移状态
        href: https://github.com/imReese/NexusKV/blob/main/docs/architecture/migration-status.md
      - label: Planner bridge
        href: https://github.com/imReese/NexusKV/blob/main/docs/design/python-rust-planner-bridge.md
      - label: Connector lifecycle
        href: https://github.com/imReese/NexusKV/blob/main/docs/design/connector-lifecycle.md
      - label: Execution boundary
        href: https://github.com/imReese/NexusKV/blob/main/docs/design/execution-boundary.md
    tags:
      - Go
      - Rust
      - Python
      - KV Cache
      - LLM Serving

diagrams:
  runtime:
    eyebrow: execution path
    title: SGLang Rust Runtime — 已实现的请求路径
    caption: 图中沿着当前代码和测试中的边界展开；生产模型执行与完整传输 backend 仍不在当前范围内。
    steps:
      - label: 协议边界
        meta: HTTP / gRPC / router
        detail: 校验文本或 tokenized 请求，并保留 PD bootstrap metadata。
        items:
          - typed proto
          - OpenAI path
      - label: Scheduler
        meta: waiting → prefill → decode
        detail: 组成 batch、应用 token budget，并在 KV transfer 就绪前阻止 decode。
        items:
          - lifecycle
          - readiness
      - label: Cache 与 worker
        meta: RadixCache + KV pages
        detail: 匹配可复用前缀、分配有限 page，并派发本地或拆分 worker。
        items:
          - page geometry
          - prefix reuse
      - label: PD 传输边界
        meta: fake / snapshot / Mooncake ABI
        detail: 构造和轮询 transfer plan；生产 Mooncake 执行仍属于集成边界。
        items:
          - checksums
          - managed regions
  platform:
    eyebrow: platform boundaries
    title: NexusKV — 当前基础与规划中的传输能力
    caption: 按职责拆层，避免把策略、规划和传输语义堆进 engine connector。
    groups:
      - label: Control plane
        detail: 已实现 scaffold 与 policy handoff。
        items:
          - Go config
          - health / admin
          - execution policy
        signals:
          - last-known-good reload
      - label: State 与 index
        detail: 已实现 versioned contract 与 Rust reuse planner。
        items:
          - descriptors
          - nxradixtree
          - exact / prefix match
      - label: Execution / data plane
        detail: 已有确定性 runner 与 baseline backend；真实传输仍在规划。
        items:
          - backend catalog
          - payload handles
          - fallback
        signals:
          - TODO real remote transport
      - label: Engine adapter
        detail: 已实现 SGLang 与 vLLM lifecycle boundary。
        items:
          - prefill / extend
          - request start
          - planner bridge

