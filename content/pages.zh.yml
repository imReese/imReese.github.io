site:
  headline: "你好，我是 Reese，主要做后端系统和大模型推理服务。"
  introduction: >
    我现在在北京，在百度 AI 计算团队做大模型推理引擎相关工作。平时更多是在看
    runtime 路径、Cache/KV Cache 行为、Mooncake TransferEngine，以及不同加速后端上的性能问题。
  location: 北京，中国

about:
  headline: "我是 Reese，一个在北京写系统、看性能、和大模型推理打交道的后端工程师。"

profile:
  focusAreas:
    - 后端系统
    - 推理 Runtime
    - KV Cache
    - Mooncake TransferEngine
    - SGLang
    - 异构后端

  aboutParagraphs:
    - 我主要做后端系统相关工作，关心可靠性、性能，也关心线上行为能不能被看清楚。
    - 现在的日常大多围绕大模型推理服务：runtime 路径、Cache/KV Cache、Mooncake TransferEngine 接入，以及不同加速后端上的性能优化。
    - "我也在持续读 SGLang 的 Rust runtime：请求怎么走完生命周期，scheduler/router 边界在哪里，gRPC 和 tokenization 怎么接起来，以及 PD 风格的 KV 传输应该怎么规划。"
    - 更早之前，我在华为做过分布式存储集群管理和 CPU 微架构性能分析。这些经历让我习惯从用户能感知的系统行为，一直追到线程、内存和指令级细节。

  currentFocus:
    eyebrow: 当前重点
    title: 大模型推理服务的系统工程
    summary: >
      我现在主要做大模型推理引擎优化，平时会顺着 Cache 行为、KV 传输路径、
      Mooncake TransferEngine 和后端 runtime 一路往下看。
    bullets:
      - 看生产推理负载里的吞吐、延迟、cache hit、内存效率和 runtime 瓶颈。
      - 跟踪 prefix cache、KV cache 生命周期、cache residency，以及 prefill/decode 路径上的传输就绪状态。
      - 验证 Mooncake TransferEngine 在 KV 传输规划、descriptor、readiness check 和后端接入上的边界。
      - "把读 SGLang runtime 的经验带回服务系统设计：请求生命周期、调度、cache 管理和传输边界。"
    links:
      - label: sglang-rs
        href: https://github.com/imReese/sglang-rs
      - label: 项目
        href: /projects

  researchAreas:
    - title: 推理引擎
      label: runtime path
      description: 顺着请求链路看调度、算子、kernel 和后端 dispatch，找出真正拖慢推理服务的路径。
      points:
        - 吞吐 / 延迟
        - 算子与 kernel 路径
        - prefill / decode 行为
      tags:
        - LLM Serving
        - Runtime
        - Scheduling
    - title: Cache 与 KV Cache
      label: memory behavior
      description: 关注 prefix cache 和 KV cache 在真实服务里的生命周期、复用、驻留和内存压力。
      points:
        - prefix cache 行为
        - KV page 生命周期
        - cache hit 与 residency
      tags:
        - Cache
        - KV Cache
        - Memory
    - title: Mooncake TE
      label: transfer engine
      description: 看 Mooncake TransferEngine 怎么接入 KV 传输，哪些状态算 ready，哪些边界需要 runtime 自己兜住。
      points:
        - KV 传输规划
        - descriptor 与 checksum 路径
        - KV-ready 判断
      tags:
        - Mooncake
        - TransferEngine
        - PD
    - title: 异构后端
      label: accelerators
      description: 优化不同加速后端的执行路径，同时尽量不把设备细节泄漏到 serving 层。
      points:
        - 加速器后端路径
        - 设备相关 runtime
        - 后端抽象
      tags:
        - Accelerators
        - Runtime
        - Backend

  impactStats:
    - value: cache + KV
      label: 内存路径
      detail: 跟踪 prefix cache、KV cache 生命周期、residency 和服务内存行为。
    - value: Mooncake TE
      label: 传输路径
      detail: 验证 KV 传输规划、descriptor 边界和 readiness check。
    - value: heterogeneous
      label: 后端路径
      detail: 围绕加速器后端抽象优化推理执行链路。
    - value: "128 -> 256"
      label: 集群规模
      detail: 扩展分布式存储集群初始化能力。
    - value: "+40%"
      label: 初始化效率
      detail: 通过异步队列和模块解耦优化集群启动路径。
    - value: "90%+"
      label: 分支覆盖率
      detail: 构建 DTFuzz 接口测试，提前挡住高风险存储缺陷。
    - value: "+30%"
      label: TLB 命中率
      detail: 在 ChampSim 里验证动态 TLB 调度思路。
    - value: "+6%"
      label: IPC
      detail: 在 CPU 仿真中度量指令级架构收益。
    - value: "+8%"
      label: 吞吐
      detail: 参与 Kunpeng CPU 工作负载的 SMT 策略调优。

  experience:
