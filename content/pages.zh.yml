      highlights:
        - 负责大模型服务系统里的推理引擎性能工作。
        - 跟踪 prefill/decode 负载中的 Cache、KV Cache 和 Mooncake TransferEngine 路径。
        - 优化不同加速后端环境中的 runtime 和 backend 路径。
        - 分析 kernel、算子、调度、内存行为、传输边界和执行链路里的瓶颈。
    - company: 华为云计算
      team: 数海实验室
      title: 计算机体系结构研究工程师
      logo: cpu
      start: '2023.07'
