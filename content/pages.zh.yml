site:
  headline: "你好，我是 Reese。我专注于可靠的后端系统。"
  introduction: >
    我在北京，当前在百度 AI 计算团队做大模型推理引擎相关工作。我的关注点包括运行时路径、
    Cache 与 KV Cache 行为、Mooncake TransferEngine，以及异构加速后端的服务性能。
  location: 北京，中国

about:
  headline: "我是 Reese，一名在北京工作的后端系统工程师。"

profile:
  focusAreas:
    - 后端系统
    - 推理运行时
    - KV Cache 系统
    - Mooncake TransferEngine
    - SGLang Runtime
    - 异构后端

  aboutParagraphs:
    - 我主要做后端系统相关工作，关注可靠性、性能以及系统在真实运行时是否足够可观测。
    - 我当前的工作聚焦在大模型服务的推理引擎性能，包括运行时路径、Cache 与 KV Cache 行为、Mooncake TransferEngine 集成，以及异构加速后端优化。
    - "我也在持续阅读和整理 SGLang 的 Rust runtime 方向：请求生命周期、scheduler/router 边界、gRPC 协议、tokenization 边界，以及 PD 风格的 KV 传输规划。"
    - 在此之前，我在华为做过分布式存储集群管理和 CPU 微架构性能分析，这段经历让我习惯从产品行为一路追到指令级细节来调试系统。

  currentFocus:
    eyebrow: 当前重点
    title: 大模型推理服务系统工程
    summary: >
      我在百度 AI 计算团队做大模型服务的推理引擎优化，重点关注 Cache 行为、KV 传输路径、
      Mooncake TransferEngine，以及异构加速运行时上的后端性能。
    bullets:
      - 分析面向生产的大模型推理负载中的吞吐、延迟、cache hit、内存效率和运行时瓶颈。
      - 跟踪 prefix cache、KV cache 生命周期、cache residency，以及 prefill/decode 服务路径上的传输就绪状态。
      - 验证 Mooncake TransferEngine 在 KV 传输规划、descriptor、readiness check 和后端集成上的边界。
      - "把 SGLang runtime 的阅读经验带回服务系统设计：请求生命周期、调度、cache 管理和传输边界。"
    links:
      - label: sglang-rs
        href: https://github.com/imReese/sglang-rs
      - label: 项目
        href: /projects

  researchAreas:
    - title: 推理引擎
      label: runtime path
      description: 分析和优化连接调度、算子、kernel 与后端 dispatch 的执行路径。
      points:
        - 吞吐 / 延迟
        - 算子与 kernel 路径
        - prefill / decode 行为
      tags:
        - LLM Serving
        - Runtime
        - Scheduling
    - title: Cache 与 KV Cache
      label: memory behavior
      description: 跟踪 prefix cache 和 KV cache 的生命周期，理解复用、驻留、内存压力和服务稳定性。
      points:
        - prefix cache 行为
        - KV page 生命周期
        - cache hit 与 residency
      tags:
        - Cache
        - KV Cache
        - Memory
    - title: Mooncake TE
      label: transfer engine
      description: 验证 Mooncake TransferEngine 在 KV 传输规划、descriptor、readiness check 和运行时边界上的集成。
      points:
        - KV 传输规划
        - descriptor 与 checksum 路径
        - KV-ready 判断
      tags:
        - Mooncake
        - TransferEngine
        - PD
    - title: 异构后端
      label: accelerators
      description: 优化加速器后端路径，同时避免把设备特定复杂度泄漏到 serving 层。
      points:
        - 加速器后端路径
        - 设备相关运行时路径
        - 后端抽象
      tags:
        - Accelerators
        - Runtime
        - Backend

  impactStats:
    - value: cache + KV
      label: memory path
      detail: 跟踪 prefix cache、KV cache 生命周期、residency 和服务内存行为。
    - value: Mooncake TE
      label: transfer path
      detail: 验证 KV 传输规划、descriptor 边界和 readiness check。
    - value: heterogeneous
      label: backends
      detail: 围绕加速器后端抽象优化推理执行路径。
    - value: 128 -> 256
      label: cluster scale
      detail: 扩展分布式存储集群初始化能力。
    - value: +40%
      label: init efficiency
      detail: 通过异步队列和模块解耦优化集群启动路径。
    - value: 90%+
      label: branch coverage
      detail: 构建 DTFuzz 接口测试，阻断高风险存储缺陷。
    - value: +30%
      label: TLB hit rate
      detail: 在 ChampSim 中验证动态 TLB 调度思路。
    - value: +6%
      label: IPC
      detail: 在 CPU 仿真中度量指令级架构收益。
    - value: +8%
      label: throughput
      detail: 参与 Kunpeng CPU 工作负载的 SMT 策略调优。

  experience:
    - company: 百度
      team: AI 计算团队
      title: 软件工程师，推理引擎
      logo: cpu
      start: '2025.06.30'
      end: 至今
      highlights:
        - 负责大模型服务系统中的推理引擎性能工作。
        - 跟踪 prefill/decode 服务负载中的 cache、KV cache 和 Mooncake TransferEngine 路径。
        - 优化异构加速环境中的运行时和后端路径。
        - 分析 kernel、算子、调度、内存行为、传输边界和执行路径上的瓶颈。
    - company: 华为云计算
      team: 数海实验室
      title: 计算机体系结构研究工程师
      logo: cpu
      start: '2023.07'
      end: '2024.07'
      highlights:
        - 使用 perf 和 Intel Pin 为 MySQL、Redis 类负载构建低开销指令流分析能力。
        - 在 ChampSim 中验证动态 TLB 调度算法，提升模拟环境下的 TLB 命中率和 IPC。
        - 与海思、openEuler 团队协作，参与 Kunpeng CPU SMT 调优和微码级性能改进。
    - company: 华为数据存储
      team: 基础设施开发
