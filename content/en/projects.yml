headline: Projects and source notes
intro: This page collects the projects I maintain and the source-code notes I write while studying SGLang, Mooncake, and HiCache. Each project includes its current status and known gaps.

overview:
  - label: Rust serving prototype
    value: SGLang Rust Runtime
    description: Implements and tests request handling, scheduling, caching, protocols, and PD transfer in Rust.
  - label: KV cache platform
    value: NexusKV
    description: Separates cache reuse, state indexing, data movement, and inference-engine integration.
  - label: Source-code notes
    value: Mooncake and HiCache
    description: Follows real read and write paths through cache lifecycle, Store semantics, and Transfer Engine integration.

items:
  - name: SGLang Rust Runtime
    description: An independent Rust prototype based on SGLang's request handling, scheduling, caching, and PD transfer concepts. It is useful for architecture and integration experiments, but it does not yet provide complete model execution, accelerator support, or production deployment.
    href: https://github.com/imReese/sglang-rs
    label: github.com/imReese/sglang-rs
    status:
      label: Experimental
      description: Request lifecycle and several integration paths are implemented and tested. Production model execution, support for accelerator backends, and deployment tooling are still incomplete.
    capabilities:
      - A Rust implementation of request lifecycle, prefill/decode scheduling, bounded KV page allocation, and RadixCache-style prefix reuse.
      - Tonic gRPC and an OpenAI-compatible HTTP interface, plus a process-level CPU PD smoke test.
      - CPU reference execution with runtime detection of CUDA/cuBLAS support and clear errors when no backend is available.
      - PD transfer plans, readiness polling, descriptor checks, and memory registration through the Mooncake ABI.
    evidenceLinks:
      - label: Current scope and limitations
        href: https://github.com/imReese/sglang-rs#current-scope
      - label: Request lifecycle tests
        href: https://github.com/imReese/sglang-rs/blob/main/crates/sglang-srt/tests/request_lifecycle.rs
      - label: PD transfer-plan tests
        href: https://github.com/imReese/sglang-rs/blob/main/crates/sglang-srt/tests/pd_transfer_plan.rs
      - label: Local PD smoke
        href: https://github.com/imReese/sglang-rs/blob/main/scripts/run_cpu_pd_smoke.sh
    tags:
      - Rust
      - SGLang
      - Scheduler
      - KV cache
      - Mooncake
  - name: NexusKV
    description: NexusKV separates KV cache reuse planning, state indexing, data movement, and inference-engine integration into independent components. The repository includes runnable baseline implementations and tests; remote transport is still in development.
    href: https://github.com/imReese/NexusKV
    label: github.com/imReese/NexusKV
    status:
      label: Core platform in development
      description: Data structures, reuse planning, engine integration, and baseline backends are implemented. RDMA, GPU Direct, distributed coordination, and performance work are not complete.
    capabilities:
      - Uses versioned attention-state definitions and a Rust nxradixtree core to plan exact matches and prefix reuse.
      - A PyO3 bridge that connects the Rust planner to SGLang and vLLM.
      - Includes a baseline executor, backend registry, fallback handling, data handles, and an in-memory store.
      - Go control-plane configuration and policy reloads that preserve the last valid configuration on failure.
    evidenceLinks:
      - label: Target architecture
        href: https://github.com/imReese/NexusKV/blob/main/docs/architecture/target-platform.md
      - label: Migration status
        href: https://github.com/imReese/NexusKV/blob/main/docs/architecture/migration-status.md
      - label: Planner bridge
        href: https://github.com/imReese/NexusKV/blob/main/docs/design/python-rust-planner-bridge.md
      - label: Connector lifecycle
        href: https://github.com/imReese/NexusKV/blob/main/docs/design/connector-lifecycle.md
      - label: Execution boundary
        href: https://github.com/imReese/NexusKV/blob/main/docs/design/execution-boundary.md
    tags:
      - Go
      - Rust
      - Python
      - KV cache
      - LLM serving

diagrams:
  runtime:
    eyebrow: Request flow
    title: SGLang Rust Runtime — implemented request flow
    caption: This diagram shows the flow covered by the current code and tests. Production model execution and complete transport backends are not implemented yet.
    steps:
      - label: Protocol handling
        meta: HTTP / gRPC / router
        detail: Validate text and token requests while preserving the bootstrap information required for PD.
        items:
          - Typed protocol
          - OpenAI-compatible API
      - label: Scheduler
        meta: waiting → prefill → decode
        detail: Form batches within token budgets and wait for transferred KV before decode.
        items:
          - Request lifecycle
          - Readiness checks
      - label: Cache and workers
        meta: RadixCache + KV pages
        detail: Match reusable prefixes, allocate pages from a bounded KV pool, and dispatch work.
        items:
          - Page layout
          - Prefix reuse
      - label: PD transfer
        meta: in-memory transport / snapshots / Mooncake ABI
        detail: Build and monitor transfer plans; production Mooncake transport is not implemented yet.
        items:
          - Descriptor checks
          - Registered memory
  platform:
    eyebrow: Module layout
    title: NexusKV — implemented modules and planned work
    caption: Control, reuse planning, data movement, and engine integration live in separate components instead of one connector layer.
    groups:
      - label: Control plane
        detail: Configuration and policy reloads are implemented.
        items:
          - Go configuration
          - Health and administration
          - Execution policy
        signals:
          - Keeps the last valid configuration
      - label: State and index
        detail: Versioned state formats and a Rust reuse planner are implemented.
        items:
          - Descriptors
          - nxradixtree
          - Exact and prefix matching
      - label: Execution and data transfer
        detail: A baseline executor and in-memory backends exist; remote transport is still in development.
        items:
          - Backend registry
          - Data handles
          - Fallback handling
        signals:
          - Remote transport is not implemented
      - label: Engine integration
        detail: Request lifecycle integration is implemented for SGLang and vLLM.
        items:
          - Prefill and extend phases
          - Request start
          - Planner integration

