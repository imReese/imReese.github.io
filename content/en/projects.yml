headline: Systems work
intro: A focused set of systems projects, implementation work, and source studies around LLM serving. Current scope is stated plainly, and tracked forks remain separate from original projects.

overview:
  - label: Runtime
    value: SGLang Rust Runtime
    description: An active Rust runtime prototype with request lifecycle, scheduling, cache, protocol, and PD transfer boundaries under construction.
  - label: KV Platform
    value: NexusKV
    description: An LLM KV cache platform foundation spanning control plane, state/index, execution, and engine adapters.
  - label: Source work
    value: Mooncake / HiCache
    description: Source notes on cache lifecycle, Store semantics, and Transfer Engine integration paths.

items:
  - name: SGLang Rust Runtime
    description: An independent Rust workspace exploring how SGLang runtime responsibilities can move behind explicit Rust boundaries. The repository is useful for architecture and integration validation today; it is not presented as a production-ready replacement for upstream SGLang.
    href: https://github.com/imReese/sglang-rs
    label: github.com/imReese/sglang-rs
    status:
      label: Active prototype
      description: Request lifecycle and integration paths are implemented and tested in stages. Production transformer execution, complete accelerator coverage, and a production deployment story remain incomplete.
    capabilities:
      - Rust request lifecycle with prefill/decode scheduling, finite KV page allocation, and RadixCache-style prefix reuse.
      - Tonic gRPC and OpenAI-compatible HTTP/router boundaries, plus a process-level CPU PD smoke path.
      - CPU reference execution, dynamic CUDA/cuBLAS capability boundaries, and explicit failure for unavailable backends.
      - PD transfer planning, readiness polling, descriptor checksums, and a managed Mooncake ABI/memory-registration boundary.
    evidenceLinks:
      - label: Current scope and limitations
        href: https://github.com/imReese/sglang-rs#current-scope
      - label: Request lifecycle tests
        href: https://github.com/imReese/sglang-rs/blob/main/crates/sglang-srt/tests/request_lifecycle.rs
      - label: PD transfer-plan tests
        href: https://github.com/imReese/sglang-rs/blob/main/crates/sglang-srt/tests/pd_transfer_plan.rs
      - label: Local PD smoke
        href: https://github.com/imReese/sglang-rs/blob/main/scripts/run_cpu_pd_smoke.sh
    tags:
      - Rust
      - SGLang
      - Scheduler
      - KV Cache
      - Mooncake
  - name: NexusKV
    description: A staged LLM KV cache platform that separates policy and control, reuse planning and state/index, execution/data movement, and engine-facing lifecycle adapters. The current repository includes deterministic implementations and tests while transport paths continue to develop.
    href: https://github.com/imReese/NexusKV
    label: github.com/imReese/NexusKV
    status:
      label: Platform foundation
      description: Contracts, planner, connector lifecycle, execution policy, and baseline backends exist. Real remote transports, RDMA/GPU-direct paths, distributed coordination, and throughput work remain planned.
    capabilities:
      - Versioned attention-state contracts and a Rust nxradixtree core for exact and prefix reuse planning.
      - A narrow PyO3 bridge used by SGLang and vLLM connector lifecycle adapters.
      - Deterministic execution runner, backend catalog, fallback model, payload handles, and in-memory baseline store.
      - Go control-plane config and reloadable policy handoff into Python execution with last-known-good behavior.
    evidenceLinks:
      - label: North star
        href: https://github.com/imReese/NexusKV/blob/main/docs/architecture/target-platform.md
      - label: Migration status
        href: https://github.com/imReese/NexusKV/blob/main/docs/architecture/migration-status.md
      - label: Planner bridge
        href: https://github.com/imReese/NexusKV/blob/main/docs/design/python-rust-planner-bridge.md
      - label: Connector lifecycle
        href: https://github.com/imReese/NexusKV/blob/main/docs/design/connector-lifecycle.md
      - label: Execution boundary
        href: https://github.com/imReese/NexusKV/blob/main/docs/design/execution-boundary.md
    tags:
      - Go
      - Rust
      - Python
      - KV Cache
      - LLM Serving

diagrams:
  runtime:
    eyebrow: execution path
    title: SGLang Rust Runtime — implemented request path
    caption: The diagram follows the boundaries currently represented in code and tests. Production model execution and complete transport backends remain outside the current scope.
    steps:
      - label: Protocol boundary
        meta: HTTP / gRPC / router
        detail: Validate text or tokenized requests and preserve PD bootstrap metadata.
        items:
          - typed proto
          - OpenAI path
      - label: Scheduler
        meta: waiting → prefill → decode
        detail: Form batches, apply token budgets, and hold decode until transferred KV is ready.
        items:
          - lifecycle
          - readiness
      - label: Cache and workers
        meta: RadixCache + KV pages
        detail: Match reusable prefixes, allocate finite pages, and dispatch local or split workers.
        items:
          - page geometry
          - prefix reuse
      - label: PD transfer boundary
        meta: fake / snapshot / Mooncake ABI
        detail: Build and poll transfer plans; production Mooncake execution remains an integration boundary.
        items:
          - checksums
          - managed regions
  platform:
    eyebrow: platform boundaries
    title: NexusKV — current foundation and planned transport work
    caption: The platform is split by responsibility so engine connectors do not absorb policy, planning, or transport semantics.
    groups:
      - label: Control plane
        detail: Implemented scaffold and policy handoff.
        items:
          - Go config
          - health / admin
          - execution policy
        signals:
          - last-known-good reload
      - label: State and index
        detail: Implemented versioned contracts and Rust reuse planner.
        items:
          - descriptors
          - nxradixtree
          - exact / prefix match
      - label: Execution / data plane
        detail: Deterministic runner and baseline backends exist; real transports are planned.
        items:
          - backend catalog
          - payload handles
          - fallback
        signals:
          - TODO real remote transport
      - label: Engine adapters
        detail: Implemented lifecycle boundaries for SGLang and vLLM.
        items:
          - prefill / extend
          - request start
          - planner bridge

