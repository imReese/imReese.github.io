selectedWork:
  - eyebrow: Runtime prototype
    title: SGLang Rust Runtime
    description: A Rust prototype that models request handling, scheduling, prefix caching, protocol boundaries, and PD transfer. It is intended for architecture and integration experiments, not as a production replacement for SGLang.
    link:
      label: View project scope
      href: https://github.com/imReese/sglang-rs#current-scope
  - eyebrow: KV cache platform
    title: NexusKV
    description: Separates KV cache reuse planning, state indexing, data movement, and engine integration into independent components. The baseline implementation and tests are in place; remote transport is still in development.
    link:
      label: Read the design notes
      href: https://github.com/imReese/NexusKV/blob/main/docs/design/execution-boundary.md
  - eyebrow: Inference control plane
    title: Locus
    description: An engine-neutral control plane that plans request placement using model semantics, fleet policy, runtime capabilities, and reusable-state locality. Local protocol and orchestration paths are implemented; live deployment qualification remains separate.
    link:
      label: Explore the architecture
      href: https://github.com/imReese/Locus/blob/main/docs/design/architecture.md

researchAreas:
  - title: Inference runtimes
    label: Scheduling and execution
    description: Optimize prefill execution, disaggregated serving, and constrained decoding across the request lifecycle.
    points:
      - Prefill acceleration and EPD
      - Batch scheduling and execution
      - Constrained decoding
    tags:
      - LLM Serving
      - Runtime
      - Scheduling
  - title: Attention Store
    label: State storage and reuse
    description: Develop attention-state storage and reuse for multiple model families and parallel deployment configurations.
    points:
      - Kimi, DeepSeek, and GLM
      - KV cache and KDA state
      - Pipeline parallelism and L3 storage
    tags:
      - KV Cache
      - KDA
      - Pipeline Parallelism
  - title: Asynchronous execution
    label: Transfer and compute overlap
    description: Reduce exposed cache I/O overhead by overlapping host-device transfers with GPU batch execution.
    points:
      - H2D and D2H transfers
      - Cache loading and persistence
      - GPU execution overlap
    tags:
      - GPU
      - Cache I/O
      - Performance
  - title: Accelerator backends
    label: Backend performance
    description: Adapt and optimize inference paths for different accelerators while keeping device-specific code isolated.
    points:
      - Accelerator execution paths
      - Device-specific code
      - Backend interfaces
    tags:
      - Accelerators
      - Runtime
      - Backend

