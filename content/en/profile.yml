selectedWork:
  - eyebrow: Runtime prototype
    title: SGLang Rust Runtime
    description: A Rust prototype that models request handling, scheduling, prefix caching, protocol boundaries, and PD transfer. It is intended for architecture and integration experiments, not as a production replacement for SGLang.
    link:
      label: View project scope
      href: https://github.com/imReese/sglang-rs#current-scope
  - eyebrow: KV cache platform
    title: NexusKV
    description: Separates KV cache reuse planning, state indexing, data movement, and engine integration into independent components. The baseline implementation and tests are in place; remote transport is still in development.
    link:
      label: Read the design notes
      href: https://github.com/imReese/NexusKV/blob/main/docs/design/execution-boundary.md
  - eyebrow: Source analysis
    title: Mooncake and HiCache internals
    description: Follows real read and write paths across SGLang, HiCache, and Mooncake Store to explain cache lookup, host-memory loading, metadata updates, and cross-node transfer.
    link:
      label: Read the source analysis
      href: /blogs/sglang-to-mooncake-store-kv-cache-path/

researchAreas:
  - title: Inference engines
    label: Scheduling and execution
    description: Analyze performance across request scheduling, operators, kernels, and backend execution.
    points:
      - Throughput and latency
      - Operator and kernel paths
      - Prefill and decode behavior
    tags:
      - LLM Serving
      - Runtime
      - Scheduling
  - title: KV cache
    label: Cache management
    description: Study prefix reuse, KV page lifecycle, memory residency, and loading across storage tiers.
    points:
      - Prefix cache behavior
      - KV page lifecycle
      - Cache hits and residency
    tags:
      - Cache
      - KV cache
      - Memory
  - title: Mooncake Transfer Engine
    label: Data movement
    description: Work on transfer planning, memory registration, descriptors, and readiness checks for KV data.
    points:
      - KV transfer planning
      - Descriptors and checksums
      - Readiness checks
    tags:
      - Mooncake
      - Transfer Engine
      - PD
  - title: Accelerator backends
    label: Backend performance
    description: Adapt and optimize inference paths for different accelerators while keeping device-specific code isolated.
    points:
      - Accelerator execution paths
      - Device-specific code
      - Backend interfaces
    tags:
      - Accelerators
      - Runtime
      - Backend

