aboutParagraphs:
  - I currently optimize LLM inference engines, focusing on scheduling, KV cache management, cross-node data movement, and accelerator backends.
  - Earlier in my career, I worked on high availability and cluster management for distributed storage, then on cloud workload analysis and CPU architecture.
  - This site collects my engineering projects, source-code notes, and lessons from debugging and validation work.

currentFocus:
  eyebrow: Current focus
  title: LLM serving systems
  summary: >
    I currently focus on scheduling, KV cache lifecycle, data movement, and
    accelerator backend performance.
  bullets:
    - I look for throughput, latency, and memory bottlenecks in request scheduling and execution.
    - I trace KV cache state through prefill, decode, cache loading, and data transfer.
    - I validate Mooncake Transfer Engine integration with inference backends.
    - I work on SGLang request handling, scheduling, and cache behavior.
  links:
