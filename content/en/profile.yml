aboutParagraphs:
  - 'I like the point where model-serving behavior becomes a systems problem: request state, scheduling, cache residency, transfer readiness, and backend capability all have to agree.'
  - My route into this work runs through distributed-storage availability and cluster management, then cloud workload and CPU analysis, and now LLM inference runtime performance.
  - 'This site is the working record behind that path: small original projects with explicit status, tracked upstream source studies, and articles that preserve the implementation trail.'

currentFocus:
  eyebrow: Current focus
  title: LLM inference engines and systems performance
  summary: >
    Current work clusters around three boundaries: runtime execution, KV state
    lifecycle, and data movement across heterogeneous serving backends.
  bullets:
    - Measure throughput, latency, cache hit rate, memory use, and runtime bottlenecks in inference workloads.
    - Trace prefix cache and KV Cache lifecycle across prefill/decode paths.
    - Validate Mooncake TransferEngine planning, descriptors, readiness checks, and backend integration.
    - 'Apply SGLang runtime patterns to request lifecycle, scheduling, cache management, and transfer boundaries.'
  links:
    - label: Projects
      href: /projects/
    - label: Source notes
      href: /blogs/

selectedWork:
  - eyebrow: Runtime prototype
    title: SGLang Rust Runtime
    description: Implemented and tested explicit Rust boundaries for request lifecycle, scheduling, prefix reuse, protocol handling, and staged PD transfer integration.
    problem: Make hidden runtime state and fallback behavior inspectable while the production execution path is still under construction.
    link:
      label: Current scope and tests
      href: https://github.com/imReese/sglang-rs#current-scope
  - eyebrow: KV cache platform
    title: NexusKV
    description: Split control policy, state/index planning, execution, and SGLang/vLLM lifecycle adapters across Go, Rust, and Python.
    problem: Keep reuse planning and transfer policy out of connector-specific branching while the real data plane is developed incrementally.
    link:
      label: Architecture and execution boundary
      href: https://github.com/imReese/NexusKV/blob/main/docs/design/execution-boundary.md
  - eyebrow: Source analysis
    title: Mooncake / HiCache internals
    description: Traced page keys, host KV memory, Store objects, replica state, and shared Transfer Engine boundaries through concrete read/write paths.
    problem: Separate cache hit, materialization, metadata visibility, and data transfer claims that are easy to blur together.
    link:
      label: SGLang to Mooncake KV path
      href: /blogs/sglang-to-mooncake-store-kv-cache-path/

researchAreas:
  - title: Inference Engine
    label: runtime path
    description: Profile and tune execution paths across scheduling, operators, kernels, and backend dispatch.
    points:
      - throughput / latency
      - operator and kernel paths
      - prefill / decode behavior
    tags:
      - LLM Serving
      - Runtime
      - Scheduling
  - title: Cache & KV Cache
    label: memory behavior
    description: Analyze prefix cache and KV Cache reuse, residency, memory pressure, and lifecycle.
    points:
      - prefix cache behavior
      - KV page lifecycle
      - cache hit and residency
    tags:
      - Cache
      - KV Cache
      - Memory
  - title: Mooncake TE
    label: transfer engine
    description: Validate Mooncake TransferEngine planning, descriptors, readiness checks, and runtime boundaries.
    points:
      - KV transfer planning
      - descriptor and checksum paths
      - KV-ready predicates
    tags:
      - Mooncake
      - TransferEngine
      - PD
  - title: Heterogeneous Backends
    label: accelerators
    description: Optimize accelerator backend paths while keeping device-specific logic behind backend interfaces.
    points:
      - accelerator backend paths
      - device-specific runtime paths
      - backend abstraction
    tags:
      - Accelerators
      - Runtime
      - Backend

