aboutParagraphs:
  - I build backend systems where reliability, performance, and operational clarity matter.
  - My current work focuses on inference engine performance for large-model serving, including runtime paths, cache and KV-cache behavior, Mooncake TransferEngine integration, and heterogeneous accelerator backend optimization.
  - "I also study SGLang's Rust runtime direction: request lifecycle, scheduler/router boundaries, gRPC protocols, tokenization edges, and PD-style KV transfer planning."
  - Before that I worked on distributed storage cluster management and CPU microarchitecture performance analysis at Huawei, which shaped how I debug systems from product behavior down to instruction-level traces.

currentFocus:
  eyebrow: Current focus
  title: LLM serving systems engineering
  summary: >
    I work on inference engine optimization for large-model serving at Baidu AI
    Computing Department, with a focus on cache behavior, KV-transfer paths,
    Mooncake TransferEngine, and backend performance across heterogeneous
    accelerator runtimes.
  bullets:
    - Analyze throughput, latency, cache hit behavior, memory efficiency, and runtime bottlenecks in production-oriented inference workloads.
    - Trace prefix cache, KV cache lifecycle, cache residency, and transfer readiness across prefill/decode serving paths.
    - Validate Mooncake TransferEngine boundaries for KV transfer planning, descriptors, readiness checks, and backend integration.
    - "Carry SGLang runtime experience into serving-system design: request lifecycle, scheduling, cache management, and transfer boundaries."
  links:
    - label: sglang-rs
      href: https://github.com/imReese/sglang-rs
    - label: Projects
      href: /projects

researchAreas:
  - title: Inference Engine
    label: runtime path
    description: Profiling and tuning the execution path that connects scheduling, operators, kernels, and backend dispatch.
    points:
      - throughput / latency
      - operator and kernel paths
      - prefill / decode behavior
    tags:
      - LLM Serving
      - Runtime
      - Scheduling
  - title: Cache & KV Cache
    label: memory behavior
    description: Tracing prefix cache and KV-cache lifecycle behavior for reuse, residency, memory pressure, and serving stability.
    points:
      - prefix cache behavior
      - KV page lifecycle
      - cache hit and residency
    tags:
      - Cache
      - KV Cache
      - Memory
  - title: Mooncake TE
    label: transfer engine
    description: Validating Mooncake TransferEngine integration for KV transfer planning, descriptors, readiness checks, and runtime boundaries.
    points:
      - KV transfer planning
      - descriptor and checksum paths
      - KV-ready predicates
    tags:
      - Mooncake
      - TransferEngine
      - PD
  - title: Heterogeneous Backends
    label: accelerators
    description: Optimizing accelerator backend paths without leaking device-specific complexity into the serving layer.
    points:
      - accelerator backend paths
      - device-specific runtime paths
      - backend abstraction
    tags:
      - Accelerators
      - Runtime
      - Backend

