aboutParagraphs:
  - I work on LLM inference engine performance at Baidu AI Computing, including runtime scheduling, KV Cache, Mooncake TransferEngine, and heterogeneous accelerator backends.
  - "I also follow SGLang's Rust runtime work: request lifecycle, scheduler/router boundaries, gRPC interfaces, tokenization, and PD KV transfer."
  - Before Baidu, I worked at Huawei Cloud's Shuhai Lab and Huawei's Data Storage Product Line, spanning cloud workload characterization, CPU architecture, distributed storage availability, and cluster management.

currentFocus:
  eyebrow: Current focus
  title: LLM inference engines and systems performance
  summary: >
    At Baidu AI Computing, I optimize LLM inference engines across runtime
    scheduling, KV Cache, Mooncake TransferEngine, and heterogeneous accelerator
    backends.
  bullets:
    - Measure throughput, latency, cache hit rate, memory use, and runtime bottlenecks in inference workloads.
    - Trace prefix cache and KV Cache lifecycle across prefill/decode paths.
    - Validate Mooncake TransferEngine planning, descriptors, readiness checks, and backend integration.
    - "Apply SGLang runtime patterns to request lifecycle, scheduling, cache management, and transfer boundaries."
  links:
    - label: sglang-rs
      href: https://github.com/imReese/sglang-rs
    - label: Projects
      href: /projects

researchAreas:
  - title: Inference Engine
    label: runtime path
    description: Profile and tune execution paths across scheduling, operators, kernels, and backend dispatch.
    points:
      - throughput / latency
      - operator and kernel paths
      - prefill / decode behavior
    tags:
      - LLM Serving
      - Runtime
      - Scheduling
  - title: Cache & KV Cache
    label: memory behavior
    description: Analyze prefix cache and KV Cache reuse, residency, memory pressure, and lifecycle.
    points:
      - prefix cache behavior
      - KV page lifecycle
      - cache hit and residency
    tags:
      - Cache
      - KV Cache
      - Memory
  - title: Mooncake TE
    label: transfer engine
    description: Validate Mooncake TransferEngine planning, descriptors, readiness checks, and runtime boundaries.
    points:
      - KV transfer planning
      - descriptor and checksum paths
      - KV-ready predicates
    tags:
      - Mooncake
      - TransferEngine
      - PD
  - title: Heterogeneous Backends
    label: accelerators
    description: Optimize accelerator backend paths while keeping device-specific logic behind backend interfaces.
    points:
      - accelerator backend paths
      - device-specific runtime paths
      - backend abstraction
    tags:
      - Accelerators
      - Runtime
      - Backend

