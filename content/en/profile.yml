focusAreas:
  - AI Inference
  - KV Cache

aboutParagraphs:
  - I work on LLM inference systems, with a focus on prefill acceleration, disaggregated serving, constrained decoding, and asynchronous runtime execution.
  - I contribute to our team’s Attention Store, supporting attention-state storage and reuse across Kimi, DeepSeek, and GLM model families, including KDA and pipeline-parallel deployments. My performance work includes overlapping H2D and D2H cache transfers with GPU computation.
  - Earlier in my career, I worked on high availability and cluster management for distributed storage, then on cloud workload analysis and CPU architecture.
  - This site collects my engineering projects, notes from reading source code, and lessons from debugging and validation work.

