<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Reese">
  <style>
    :root {
      color-scheme: light dark;
      --bg0: #f8fafc;
      --bg1: #e9eef3;
      --bg2: #f4f7fa;
      --mark: #4b5168;
      --hairline: #c8d2dd;
      --accent: #0f766e;
      --glow: #99f6e4;
      --shadow: #64748b;
      --shadow-opacity: 0.14;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg0: #1a1d2a;
        --bg1: #0f111b;
        --bg2: #171925;
        --mark: #e8ebf5;
        --hairline: #34384d;
        --accent: #94e2d5;
        --glow: #0f766e;
        --shadow: #000000;
        --shadow-opacity: 0.34;
      }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="82" x2="430" y1="44" y2="468" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--bg0)"/>
      <stop offset="0.58" stop-color="var(--bg1)"/>
      <stop offset="1" stop-color="var(--bg2)"/>
    </linearGradient>
    <linearGradient id="accent" x1="78" x2="434" y1="407" y2="407" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--accent)" stop-opacity="0"/>
      <stop offset="0.22" stop-color="var(--accent)" stop-opacity="0.58"/>
      <stop offset="0.5" stop-color="var(--accent)"/>
      <stop offset="0.78" stop-color="var(--accent)" stop-opacity="0.58"/>
      <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="var(--shadow)" flood-opacity="var(--shadow-opacity)"/>
    </filter>
    <filter id="lineGlow" x="-20%" y="-200%" width="140%" height="500%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="98" fill="none" stroke="var(--hairline)" stroke-width="10" opacity="0.72"/>
  <g transform="translate(15 24) scale(0.94)">
    <path d="M159 361V151h108c32 0 57 8 75 23 18 16 27 37 27 64 0 19-5 35-15 49-9 13-23 24-40 31l59 43h-67l-50-39h-45v39h-52Zm52-84h51c17 0 30-3 39-10 9-7 13-17 13-30s-4-23-13-30c-9-7-22-10-39-10h-51v80Z" fill="var(--mark)" filter="url(#markShadow)"/>
  </g>
  <rect x="78" y="398" width="356" height="18" rx="9" fill="url(#accent)"/>
  <rect x="104" y="400" width="304" height="30" rx="15" fill="var(--glow)" opacity="0.2" filter="url(#lineGlow)"/>
